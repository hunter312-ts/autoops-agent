services:

  # -----------------------------------------
  # FastAPI Backend
  # -----------------------------------------

  api:
    build: .
    container_name: autoops-api

    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./autoops.db:/app/autoops.db
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json

    restart: unless-stopped


  # -----------------------------------------
  # Streamlit Dashboard
  # -----------------------------------------

  streamlit:
    build: .
    container_name: autoops-streamlit

    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - api

    volumes:
      - ./autoops.db:/app/autoops.db
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json

    restart: unless-stopped